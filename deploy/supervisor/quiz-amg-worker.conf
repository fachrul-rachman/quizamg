[program:quiz-amg-worker]
process_name=%(program_name)s
command=/usr/bin/php /var/www/quiz-amg/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=180 --max-time=3600
directory=/var/www/quiz-amg
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=210
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/quiz-amg/storage/logs/queue-worker.log
